# CI for open-agent-definitions
#
# Gates — keep this file as the single source of truth for "what does main
# need to pass?". Future maintainers (AI or human): if a check belongs here,
# wire it as a named step with a clear gate label so failures are diagnosable
# from the Actions UI without scrolling logs.
#
#   1. build.sh — the full validation gate. Stages sources to build/,
#      regenerates Claude subagents, then runs validate.py (opencode.json
#      JSON-schema check, prompt-file refs, Grok frontmatter allowlist,
#      Claude frontmatter, model-registry check). `set -e` here ensures any
#      validation error fails the job immediately — don't relax it.
#
#   2. pytest — 128 unit tests covering scripts/lib/model_registry.py and the
#      validate.py integration. Kept here (not under build.sh) so a refactor
#      can run the suite without rebuilding.
#
#   3. live model drift — informational diff of the committed registry
#      snapshot (config/model-registry.txt) against `opencode models`.
#      Always informational; the script handles a missing `opencode` CLI
#      gracefully (prints `[info] CLI not on PATH`, exits 0), and we
#      deliberately do NOT install opencode in this workflow — keeps the job
#      well under the 3-minute acceptance bar. On drift, the script prints
#      the `opencode models > config/model-registry.txt` refresh command.
#
#   4. smoke evals — run both eval tasks under evals/tasks/ through the
#      harness (scripts/lib/run_evals.py). This step doubles as a CI-gated
#      signal that the eval harness itself is wired up: 01-repo-health
#      intentionally repeats the build + pytest gates so any harness break
#      surfaces here with a recognisable failure label. No
#      continue-on-error: an eval failure must fail the job. Eval manifests
#      land in evals/results/, which is gitignored.
#
#   5. prompt regression gate — golden ordered traces of the prompt files
#      (evals/golden/cases.json) checked against the committed baseline
#      (evals/golden/baseline.json), plus the offline promptfoo config check
#      (evals/promptfoo.yaml). Pure Python, no npm, no network beyond one
#      `git fetch` on pull requests. Gates 1–4 stay unconditional: this step
#      self-filters on PRs (prints an explicit SKIP line when nothing under
#      prompts/, grok/agents/, evals/, or scripts/lib/ changed) and always
#      runs on push to main. Fails closed — a missing/malformed baseline exits
#      2 and fails the job.
#
# Model-health probing (scripts/lib/probe_models.py, MDU-38) is deliberately
# NOT wired in here: CI has no `opencode` CLI by design, and a probe costs one
# live inference per model. It runs locally and is gated at deploy time
# (deploy.sh --gate); the report is machine-local and gitignored.
#
# No Docker, no npm. Only actions/checkout and actions/setup-python.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run for the same ref so a fast follow-up push/PR
# doesn't queue behind a slow previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # no requirements.txt/pyproject.toml exists at repo root, so pip caching is skipped intentionally

      - name: install pytest
        run: pip install pytest jsonschema

      - name: gate 1 — build + validate (./build.sh)
        run: |
          set -euo pipefail
          ./build.sh

      - name: gate 2 — unit tests (pytest)
        run: python3 -m pytest tests/ -q

      - name: gate 3 — live model drift (advisory; never fails; prints refresh instructions on stale snapshot)
        continue-on-error: true
        run: python3 scripts/lib/model_registry.py --check opencode.json --live

      - name: gate 4 — smoke evals (01-repo-health + 02-registry-alignment; doubles as harness wiring check)
        run: |
            python3 scripts/lib/run_evals.py run evals/tasks/01-repo-health && \
            python3 scripts/lib/run_evals.py run evals/tasks/02-registry-alignment

      - name: gate 5 — prompt regression gate (golden ordered traces vs committed baseline + promptfoo offline check)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"; then
              if ! changed="$(git diff --name-only FETCH_HEAD HEAD -- prompts grok/agents evals scripts/lib)"; then
                echo "FAIL prompt-regression-gate (git diff failed)"
                exit 1
              fi
              if [ -z "$changed" ]; then
                echo "SKIP prompt-regression-gate (no changes under prompts/, grok/agents/, evals/, scripts/lib/)"
                exit 0
              fi
              echo "[info] changed paths under the gate filter:"
              echo "$changed"
            else
              echo "[info] could not fetch the base ref; running the gate unconditionally"
            fi
          fi
          python3 scripts/lib/prompt_regression.py gate
          python3 scripts/lib/prompt_regression.py check-config
